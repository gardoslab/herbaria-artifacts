# Compiles benchmark-paper/main.tex on push/PR and uploads the PDF as a build artifact.
# Citation-key lint (T-1.9) is not implemented yet — scaffold only.
name: latex

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: benchmark-paper

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-paper
          path: benchmark-paper/main.pdf
